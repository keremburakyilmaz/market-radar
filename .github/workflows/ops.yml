name: Market Radar Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Requested production operation
        required: true
        type: choice
        options:
          - rollback
          - pause
          - resume
      snapshot_key:
        description: Immutable v1 snapshot key; required only for rollback
        required: false
        type: string
      reason:
        description: Audit reason for the requested operation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: market-radar-production
  cancel-in-progress: false

jobs:
  fail-closed-scaffold:
    name: Reject unsupported mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: market-radar-production
    env:
      OPERATION: ${{ inputs.operation }}
      SNAPSHOT_KEY: ${{ inputs.snapshot_key }}

    steps:
      - name: Validate request shape
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Production operations must be dispatched from main."
            exit 1
          fi

          if [[ "${OPERATION}" == "rollback" ]]; then
            if [[ ! "${SNAPSHOT_KEY}" =~ ^v1/snapshots/[0-9]{4}/[0-9]{2}/[0-9]{2}/[A-Za-z0-9._-]+-[a-f0-9]{64}\.json$ ]]; then
              echo "::error::Rollback requires a safe immutable v1 snapshot key."
              exit 1
            fi
          elif [[ -n "${SNAPSHOT_KEY}" ]]; then
            echo "::error::snapshot_key is accepted only for rollback."
            exit 1
          fi

      - name: Refuse unsupported operation
        run: |
          {
            echo "## Operation refused"
            echo
            echo "The application has no validated rollback or publication-control command yet."
            echo "No R2 credentials were exposed and no object was changed."
            echo "See docs/deployment.md for the required implementation boundary."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::Fail closed: rollback, pause, and resume are not implemented by the CLI."
          exit 1
