name: Market Radar Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Requested production operation
        required: true
        type: choice
        options:
          - rollback
          - pause
          - resume
      snapshot_key:
        description: Immutable v1 snapshot key; required only for rollback
        required: false
        type: string
      reason:
        description: Audit reason for the requested operation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: market-radar-production
  cancel-in-progress: false

jobs:
  operate:
    name: ${{ inputs.operation }} publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: market-radar-operations
    env:
      OPERATION: ${{ inputs.operation }}
      SNAPSHOT_KEY: ${{ inputs.snapshot_key }}
      OPERATION_REASON: ${{ inputs.reason }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
      R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}

    steps:
      - name: Validate request shape
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Production operations must be dispatched from main."
            exit 1
          fi

          if [[ "${OPERATION}" == "rollback" ]]; then
            if [[ ! "${SNAPSHOT_KEY}" =~ ^v1/snapshots/[0-9]{4}/[0-9]{2}/[0-9]{2}/[A-Za-z0-9._-]+-[a-f0-9]{64}\.json$ ]]; then
              echo "::error::Rollback requires a safe immutable v1 snapshot key."
              exit 1
            fi
          elif [[ -n "${SNAPSHOT_KEY}" ]]; then
            echo "::error::snapshot_key is accepted only for rollback."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install operations runtime
        run: python -m pip install ".[r2]"

      - name: Pause publication
        if: inputs.operation == 'pause'
        env:
          R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
        run: >-
          python -m market_radar ops pause
          --target r2
          --reason "${OPERATION_REASON}"
          --actor "${GITHUB_ACTOR}"

      - name: Resume publication
        if: inputs.operation == 'resume'
        env:
          R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
        run: >-
          python -m market_radar ops resume
          --target r2
          --reason "${OPERATION_REASON}"
          --actor "${GITHUB_ACTOR}"

      - name: Pause and roll back public pointer
        if: inputs.operation == 'rollback'
        env:
          R2_PUBLIC_ACCESS_KEY_ID: ${{ secrets.R2_PUBLIC_ACCESS_KEY_ID }}
          R2_PUBLIC_SECRET_ACCESS_KEY: ${{ secrets.R2_PUBLIC_SECRET_ACCESS_KEY }}
          R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
        run: >-
          python -m market_radar ops rollback
          --target r2
          --snapshot-key "${SNAPSHOT_KEY}"
          --reason "${OPERATION_REASON}"
          --actor "${GITHUB_ACTOR}"

      - name: Summarize operation
        if: success()
        run: |
          {
            echo "## Market Radar operation"
            echo
            echo "- Operation: ${OPERATION}"
            echo "- Actor: ${GITHUB_ACTOR}"
            if [[ "${OPERATION}" == "rollback" ]]; then
              echo "- Promoted snapshot: ${SNAPSHOT_KEY}"
              echo "- Publication remains paused until an explicit resume"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
