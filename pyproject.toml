[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-radar"
version = "0.1.0"
description = "A source-first macro intelligence snapshot engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kerem Burak Yilmaz" }]
dependencies = []

[project.optional-dependencies]
r2 = ["boto3>=1.34,<2"]
dev = [
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
]

[project.scripts]
market-radar = "market_radar.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/market-radar/schemas" = [
  "schemas/manifest.v1.schema.json",
  "schemas/snapshot.v1.schema.json",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src"]
